<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruno – Leas virtuelles Haustier 🐾</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6eb4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1a0a2e;
      --panel:   #2d1b4e;
      --panel2:  #3d2560;
      --accent1: #ff6ec7;
      --accent2: #7ef9ff;
      --accent3: #ffe66d;
      --green:   #39ff14;
      --red:     #ff3860;
      --phoenix: #ff9a3c;
      --pixel:   'Press Start 2P', monospace;
      --radius:  12px;
    }

    body {
      background: var(--bg);
      font-family: var(--pixel);
      color: #e0d0ff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px 32px;
      overflow-x: hidden;
      background-image:
        radial-gradient(1px 1px at 10% 20%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 70%, #ddd 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 10%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 55%, #ccc 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 30%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 85%, #ddd 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 80%, #fff 0%, transparent 100%),
        radial-gradient(2px 2px at 60% 40%, rgba(126,249,255,0.4) 0%, transparent 100%),
        radial-gradient(2px 2px at 25% 50%, rgba(255,110,199,0.3) 0%, transparent 100%);
      background-color: var(--bg);
    }

    header { text-align: center; margin-bottom: 14px; }
    header h1 {
      font-size: clamp(0.7rem, 3.5vw, 1rem);
      color: var(--accent3);
      text-shadow: 0 0 8px var(--accent3);
      letter-spacing: 2px;
    }
    header p.subtitle {
      font-size: clamp(0.45rem, 2vw, 0.6rem);
      color: var(--accent2);
      margin-top: 4px;
      opacity: 0.8;
    }

    .card {
      background: var(--panel);
      border: 3px solid var(--accent1);
      border-radius: var(--radius);
      box-shadow: 0 0 24px rgba(255,110,199,0.4), inset 0 0 12px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      padding: 16px;
    }

    .pet-stage {
      position: relative;
      background: linear-gradient(180deg, #0d0522 0%, #1a0a2e 60%, #2a103c 100%);
      border: 2px solid var(--panel2);
      border-radius: 10px;
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .pet-stage::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 28px;
      background: repeating-linear-gradient(90deg, #3d2560 0px, #3d2560 8px, #4a2d72 8px, #4a2d72 16px);
      border-top: 3px solid var(--accent1);
    }

    /* ── Bruno ── */
    .bruno {
      position: relative;
      width: 80px; height: 90px;
      margin-bottom: 30px;
      z-index: 2;
      transition: filter 0.4s;
    }
    .bruno .body {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 56px; height: 52px;
      background: var(--accent2);
      border-radius: 40% 40% 30% 30% / 50% 50% 40% 40%;
      border: 3px solid #1a8a99;
      box-shadow: inset -6px -6px 0 rgba(0,0,0,0.15);
    }
    .bruno .leg {
      position: absolute;
      bottom: -10px;
      width: 14px; height: 18px;
      background: var(--accent2);
      border: 3px solid #1a8a99;
      border-radius: 4px 4px 8px 8px;
    }
    .bruno .leg.left  { left: 10px; transform-origin: top center; }
    .bruno .leg.right { right: 10px; transform-origin: top center; }
    .bruno .arm {
      position: absolute;
      bottom: 20px;
      width: 12px; height: 26px;
      background: var(--accent2);
      border: 3px solid #1a8a99;
      border-radius: 6px;
      transform-origin: top center;
    }
    .bruno .arm.left  { left: -6px; transform: rotate(20deg); }
    .bruno .arm.right { right: -6px; transform: rotate(-20deg); }
    .bruno .head {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 62px; height: 58px;
      background: var(--accent2);
      border-radius: 50% 50% 44% 44% / 54% 54% 46% 46%;
      border: 3px solid #1a8a99;
      box-shadow: inset -6px -6px 0 rgba(0,0,0,0.1);
    }
    .bruno .ear {
      position: absolute;
      top: -10px;
      width: 16px; height: 20px;
      background: var(--accent2);
      border: 3px solid #1a8a99;
      border-radius: 50% 50% 0 0;
    }
    .bruno .ear.left  { left: 6px; }
    .bruno .ear.right { right: 6px; }
    .bruno .ear::after {
      content: '';
      position: absolute;
      top: 4px; left: 50%;
      transform: translateX(-50%);
      width: 6px; height: 10px;
      background: var(--accent1);
      border-radius: 50% 50% 0 0;
      opacity: 0.6;
    }
    .bruno .eye {
      position: absolute;
      top: 18px;
      width: 12px; height: 14px;
      background: #1a0a2e;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    .bruno .eye.left  { left: 10px; }
    .bruno .eye.right { right: 10px; }
    .bruno .eye::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 5px; height: 5px;
      background: #fff;
      border-radius: 50%;
    }
    .bruno .nose {
      position: absolute;
      top: 34px; left: 50%;
      transform: translateX(-50%);
      width: 8px; height: 5px;
      background: var(--accent1);
      border-radius: 50%;
      border: 1px solid #c05090;
    }
    .bruno .mouth {
      position: absolute;
      bottom: 10px; left: 50%;
      transform: translateX(-50%);
      width: 22px; height: 12px;
      border: 3px solid #1a0a2e;
      border-top: none;
      border-radius: 0 0 14px 14px;
    }
    .bruno .cheek {
      position: absolute;
      top: 30px;
      width: 12px; height: 8px;
      background: rgba(255,110,199,0.45);
      border-radius: 50%;
    }
    .bruno .cheek.left  { left: 4px; }
    .bruno .cheek.right { right: 4px; }
    .bruno .tail {
      position: absolute;
      bottom: 10px; right: -14px;
      width: 18px; height: 12px;
      background: var(--accent2);
      border: 3px solid #1a8a99;
      border-radius: 0 50% 50% 0;
      transform-origin: left center;
    }

    /* Mood overrides */
    .bruno.neutral .mouth {
      width: 18px; height: 4px;
      border-radius: 4px;
      border: 3px solid #1a0a2e;
      border-top: 3px solid #1a0a2e;
    }
    .bruno.sad .mouth {
      border: 3px solid #1a0a2e;
      border-bottom: none;
      border-top: none;
      border-radius: 14px 14px 0 0;
      bottom: 8px;
      height: 10px;
    }
    .bruno.sad .eye  { height: 10px; }
    .bruno.sad .cheek { opacity: 0; }

    /* ── Animations ── */
    @keyframes bounce      { 0%,100%{transform:translateY(0)}      50%{transform:translateY(-12px)} }
    @keyframes tailWag     { 0%,100%{transform:rotate(0deg)}       50%{transform:rotate(30deg)} }
    @keyframes sadDroop    { 0%,100%{transform:translateY(0)}       50%{transform:translateY(3px)} }
    @keyframes legWalk     { 0%,100%{transform:rotate(0deg)}        50%{transform:rotate(20deg)} }
    @keyframes armRaise    { 0%,100%{transform:rotate(20deg)}       50%{transform:rotate(-30deg)} }
    @keyframes armRaiseR   { 0%,100%{transform:rotate(-20deg)}      50%{transform:rotate(30deg)} }
    @keyframes blinkEye    { 0%,90%,100%{transform:scaleY(1)}       95%{transform:scaleY(0.1)} }
    @keyframes exerciseJump{ 0%,100%{transform:translateY(0)}       30%{transform:translateY(-20px)} 60%{transform:translateY(-8px)} }
    @keyframes float       { 0%,100%{transform:translateY(0px)}     50%{transform:translateY(-5px)} }
    @keyframes sparkle     { 0%{opacity:0;transform:scale(0) rotate(0deg)} 50%{opacity:1;transform:scale(1.2) rotate(180deg)} 100%{opacity:0;transform:scale(0) rotate(360deg)} }
    @keyframes bubblePop   { 0%{transform:scale(0) translateY(0);opacity:1} 70%{transform:scale(1) translateY(-20px);opacity:1} 100%{transform:scale(0.8) translateY(-30px);opacity:0} }

    @keyframes phoenixPulse {
      0%,100% { transform: translateY(0) scale(1); filter: brightness(1) saturate(1); }
      40%     { transform: translateY(-5px) scale(1.06); filter: brightness(1.6) saturate(2) hue-rotate(15deg); }
    }
    @keyframes phoenixVanish {
      0%   { opacity: 1; transform: scale(1); filter: brightness(1); }
      50%  { opacity: 1; transform: scale(1.25); filter: brightness(4) saturate(3); }
      100% { opacity: 0; transform: scale(0.1); filter: brightness(8); }
    }
    @keyframes eggAppear {
      0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
      70%  { transform: scale(1.1) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes eggGlow {
      0%,100% { box-shadow: 0 0 16px rgba(255,180,0,0.8), 0 0 36px rgba(255,100,0,0.35); }
      50%     { box-shadow: 0 0 30px rgba(255,230,0,1),   0 0 60px rgba(255,150,0,0.8); }
    }
    @keyframes eggWobble {
      0%,100% { transform: rotate(0deg) translateY(0); }
      20%     { transform: rotate(-10deg) translateY(-3px); }
      40%     { transform: rotate(10deg) translateY(-4px); }
      60%     { transform: rotate(-7deg) translateY(-2px); }
      80%     { transform: rotate(7deg) translateY(-3px); }
    }
    @keyframes eggHatch {
      0%   { transform: scale(1); opacity: 1; filter: brightness(1); }
      50%  { transform: scale(1.4); filter: brightness(3); opacity: 1; }
      100% { transform: scale(2.5); filter: brightness(8); opacity: 0; }
    }
    @keyframes newBrunoAppear {
      0%   { transform: scale(0) translateY(12px); opacity: 0; filter: brightness(4); }
      65%  { transform: scale(1.15) translateY(-4px); opacity: 1; filter: brightness(1.6); }
      100% { transform: scale(1) translateY(0); opacity: 1; filter: brightness(1); }
    }
    @keyframes stageFlash {
      0%,100% { background-color: transparent; }
      50%     { background-color: rgba(255,210,60,0.65); }
    }

    /* State animations */
    .bruno.happy          { animation: bounce 0.7s ease-in-out infinite; }
    .bruno.happy .tail    { animation: tailWag 0.3s ease-in-out infinite; }
    .bruno.happy .eye     { animation: blinkEye 3s ease-in-out infinite; }
    .bruno.happy .arm.left  { animation: armRaise  0.7s ease-in-out infinite; }
    .bruno.happy .arm.right { animation: armRaiseR 0.7s ease-in-out infinite; }

    .bruno.neutral        { animation: float 2.5s ease-in-out infinite; }
    .bruno.neutral .tail  { animation: tailWag 1s ease-in-out infinite; }
    .bruno.neutral .eye   { animation: blinkEye 4s ease-in-out infinite; }

    .bruno.sad            { animation: sadDroop 2s ease-in-out infinite; }
    .bruno.sad .tail      { animation: none; transform: rotate(-20deg); }

    .bruno.exercise       { animation: exerciseJump 0.5s ease-in-out infinite; }
    .bruno.exercise .leg.left  { animation: legWalk 0.25s ease-in-out infinite; }
    .bruno.exercise .leg.right { animation: legWalk 0.25s ease-in-out infinite reverse; }

    .bruno.phoenix        { animation: phoenixPulse 0.55s ease-in-out infinite; }
    .bruno.phoenix .tail  { animation: tailWag 0.2s ease-in-out infinite; }

    /* ── Egg ── */
    .egg-wrap {
      position: absolute;
      bottom: 30px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }
    .egg-wrap.show { display: flex; animation: eggAppear 0.6s ease-out both; }
    .egg {
      width: 54px; height: 68px;
      background: radial-gradient(ellipse at 38% 30%, #fffde0 0%, #ffd700 45%, #ff8c00 100%);
      border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
      border: 3px solid #b36000;
      position: relative;
      animation: eggGlow 1.8s ease-in-out infinite;
    }
    .egg.wobbling { animation: eggGlow 1.8s ease-in-out infinite, eggWobble 0.45s ease-in-out 4; }
    .egg.hatching { animation: eggHatch 0.65s ease-out forwards; }
    .egg-crack {
      position: absolute;
      background: rgba(70,25,0,0.55);
      border-radius: 2px;
    }
    .egg-crack.c1 { width: 2px; height: 14px; top: 22px; left: 22px; transform: rotate(20deg); }
    .egg-crack.c2 { width: 2px; height: 10px; top: 28px; left: 28px; transform: rotate(-15deg); }
    .egg-crack.c3 { width: 2px; height: 8px;  top: 18px; left: 30px; transform: rotate(40deg); }
    .egg-label {
      margin-top: 6px;
      font-size: clamp(0.3rem, 1.3vw, 0.4rem);
      color: var(--phoenix);
      text-shadow: 0 0 6px var(--phoenix);
      text-align: center;
      line-height: 1.8;
    }

    /* Stage flash */
    .stage-flash {
      position: absolute; inset: 0;
      background: transparent;
      z-index: 8;
      pointer-events: none;
      border-radius: 10px;
    }
    .stage-flash.active { animation: stageFlash 0.4s ease-out 1 forwards; }

    /* Sparkles */
    .sparkles { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 3; }
    .sparkle  { position: absolute; font-size: 14px; animation: sparkle 0.8s ease-out forwards; }

    /* Speech bubble */
    .speech-bubble {
      position: absolute;
      top: 12px; left: 8px; right: 8px;
      background: var(--panel2);
      border: 2px solid var(--accent3);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: clamp(0.35rem, 1.8vw, 0.48rem);
      color: var(--accent3);
      line-height: 1.6;
      text-align: center;
      z-index: 5;
      box-shadow: 0 0 10px rgba(255,230,109,0.3);
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px; left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--accent3);
    }

    /* Stats */
    .stats { margin-bottom: 14px; }
    .stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .stat-label { font-size: clamp(0.5rem, 2.5vw, 0.65rem); width: 100px; flex-shrink: 0; color: #d0c0ff; }
    .stat-bar-bg {
      flex: 1; height: 18px;
      background: #0d0522;
      border: 2px solid var(--panel2);
      border-radius: 6px;
      overflow: hidden;
    }
    .stat-bar { height: 100%; border-radius: 4px; transition: width 0.6s ease, background-color 0.4s; }
    .stat-bar.water    { background: linear-gradient(90deg, #1a8aff, var(--accent2)); }
    .stat-bar.food     { background: linear-gradient(90deg, #39ff14, #9cff14); }
    .stat-bar.exercise { background: linear-gradient(90deg, #ff6ec7, #ff9a3c); }
    .stat-bar.low      { background: linear-gradient(90deg, #ff8c00, var(--accent3)) !important; }
    .stat-bar.crit     { background: linear-gradient(90deg, var(--red), #ff6060) !important; }
    .stat-val { font-size: clamp(0.42rem, 1.8vw, 0.55rem); width: 36px; text-align: right; color: var(--accent2); }

    /* Buttons */
    .buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .btn {
      position: relative;
      background: var(--panel2);
      border: 3px solid var(--accent1);
      color: #fff;
      font-family: var(--pixel);
      font-size: clamp(0.4rem, 1.8vw, 0.55rem);
      padding: 10px 4px 8px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 4px 0 #8c2a7a, 0 0 8px rgba(255,110,199,0.2);
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .btn:active, .btn.pressed { transform: translateY(3px); box-shadow: 0 1px 0 #8c2a7a; }
    .btn:hover { background: #4a2d72; }
    .btn .btn-icon { font-size: 1.4rem; display: block; margin-bottom: 2px; }
    .btn.water-btn    { border-color: var(--accent2); box-shadow: 0 4px 0 #0a5566, 0 0 8px rgba(126,249,255,0.2); }
    .btn.food-btn     { border-color: var(--green);   box-shadow: 0 4px 0 #1a6600, 0 0 8px rgba(57,255,20,0.2); }
    .btn.exercise-btn { border-color: var(--accent3); box-shadow: 0 4px 0 #886600, 0 0 8px rgba(255,230,109,0.2); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

    /* Status message */
    .status-msg {
      background: var(--panel2);
      border: 2px solid var(--panel2);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: clamp(0.38rem, 1.7vw, 0.5rem);
      color: #b090f0;
      line-height: 1.8;
      text-align: center;
      min-height: 38px;
      transition: color 0.3s;
    }

    /* Mood indicator */
    .mood-bar { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }
    .mood-dot { width: 12px; height: 12px; border-radius: 3px; background: var(--panel2); transition: background 0.4s; }
    .mood-dot.active { background: var(--accent1); box-shadow: 0 0 6px var(--accent1); }
    .mood-label { font-size: clamp(0.38rem, 1.6vw, 0.5rem); color: var(--accent1); }

    /* Scanline */
    .scanline {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
      pointer-events: none;
      z-index: 999;
    }

    footer { margin-top: 14px; font-size: clamp(0.32rem, 1.4vw, 0.42rem); color: #5a3a7a; text-align: center; line-height: 2; }
    .gen-info { color: var(--phoenix); opacity: 0.9; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--panel2);
      border: 2px solid var(--accent1);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: clamp(0.38rem, 1.6vw, 0.5rem);
      color: var(--accent3);
      z-index: 9999;
      transition: transform 0.35s cubic-bezier(.22,1.5,.5,1), opacity 0.35s;
      opacity: 0;
      text-align: center;
      max-width: 90vw;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .float-pop { position: fixed; font-size: 2rem; pointer-events: none; z-index: 9998; animation: bubblePop 1s ease-out forwards; }
  </style>
</head>
<body>

<div class="scanline"></div>

<header>
  <h1>🐾 BRUNO 🐾</h1>
  <p class="subtitle">Leas virtuelles Haustier · Pixel Edition</p>
</header>

<div class="card">
  <div class="pet-stage" id="petStage">
    <div class="speech-bubble" id="speechBubble">
      Hallo Lea! Ich freu mich auf unsere Zeit zusammen! 🎉
    </div>

    <div class="bruno happy" id="bruno">
      <div class="head">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>
      <div class="body">
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="tail"></div>
      </div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>

    <div class="egg-wrap" id="eggWrap">
      <div class="egg" id="egg"></div>
      <div class="egg-label" id="eggLabel">🔥 schlüpft bald... 🔥</div>
    </div>

    <div class="sparkles" id="sparkles"></div>
    <div class="stage-flash" id="stageFlash"></div>
  </div>

  <div class="mood-bar">
    <div class="mood-dot active" id="md1"></div>
    <div class="mood-dot active" id="md2"></div>
    <div class="mood-dot active" id="md3"></div>
    <div class="mood-dot" id="md4"></div>
    <div class="mood-dot" id="md5"></div>
    <span class="mood-label" id="moodLabel">HAPPY</span>
  </div>

  <div class="stats">
    <div class="stat-row">
      <div class="stat-label">💧 Wasser</div>
      <div class="stat-bar-bg"><div class="stat-bar water" id="waterBar" style="width:100%"></div></div>
      <div class="stat-val" id="waterVal">100</div>
    </div>
    <div class="stat-row">
      <div class="stat-label">🥗 Essen</div>
      <div class="stat-bar-bg"><div class="stat-bar food" id="foodBar" style="width:100%"></div></div>
      <div class="stat-val" id="foodVal">100</div>
    </div>
    <div class="stat-row">
      <div class="stat-label">🏃 Bewegung</div>
      <div class="stat-bar-bg"><div class="stat-bar exercise" id="exerciseBar" style="width:100%"></div></div>
      <div class="stat-val" id="exerciseVal">100</div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn water-btn" onclick="feedAction('water')" id="btnWater">
      <span class="btn-icon">💧</span>Wasser<br/>geben
    </button>
    <button class="btn food-btn" onclick="feedAction('food')" id="btnFood">
      <span class="btn-icon">🥗</span>Füttern
    </button>
    <button class="btn exercise-btn" onclick="feedAction('exercise')" id="btnExercise">
      <span class="btn-icon">🏃</span>Sport<br/>machen
    </button>
  </div>

  <div class="status-msg" id="statusMsg">Alles im grünen Bereich! Bruno liebt dich. 💜</div>
</div>

<footer>
  Made with 💜 for Lea · Bruno v2.0<br/>
  <span class="gen-info" id="genInfo">Generation 1</span>
</footer>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════
   BRUNO – ENGINE v2 (Phönix Edition)
   ══════════════════════════════════════════════ */

// ── Config ──
const DECAY_RATE          = { water: 0.8, food: 0.6, exercise: 0.4 }; // % per minute
const REFILL_AMOUNT       = 35;
const TICK_INTERVAL       = 3000;  // ms
const PHOENIX_AGE_MINUTES = 120;   // minimum active minutes before phoenix can trigger
const HATCH_DELAY_MS      = 12000; // egg-to-hatch delay

// ── Messages ──
const MESSAGES = {
  water: {
    low:  [
      "Ich sterbe gleich vor Durst... und du? 💀",
      "Wasser ist Leben. Wo. Ist. Das. Wasser.",
      "Mein Mund ist trockener als die Sahara 🏜️",
      "Bitte, Lea. Nur ein Schluck. Ich flehe dich an.",
      "Ich weine gerade – aber aus Mangel an Flüssigkeit.",
      "H₂O? Nie gehört in diesem Haushalt. 😤"
    ],
    crit: [
      "ICH VERDURSTE HIER!! NOTRUF! 🚨",
      "Letzte Worte: ...W...Was...ser...",
      "Lea. LEA. WASSER. BITTE. JETZT. 💀💧",
      "Mein Anwalt wird von dir hören. Verdursten ist illegal.",
      "404: Wasser nicht gefunden. Ich auch bald nicht mehr. 👻"
    ]
  },
  food: {
    low:  [
      "Mein Magenknurren ist lauter als dein Wecker 🔔",
      "Ich hab Hunger und du bist hier einfach... nichts? 🥲",
      "Essen wäre schon geil jetzt, nur so als Idee.",
      "Der letzte Bissen war vor einer Ewigkeit. Bin ich ein Sklave?",
      "Ich muss jetzt an Essen denken, um nicht an Hunger zu denken.",
      "Lea, mein Magen und ich sind uns einig: DU BIST SCHULD. 😤"
    ],
    crit: [
      "ICH VERHUNGERE!! ESSEN JETZT!! 🍕🚨",
      "Sende Lebenszeichen... nein, doch nicht. Zu schwach.",
      "Die Rippen sehe ich schon durch das Fell. Ich hoffe das macht dir was.",
      "MAHLZEIT. Oder halt nicht. Weil keine. 😭",
      "Ich esse gleich die Möbel. Das steht auf deine Kaution."
    ]
  },
  exercise: {
    low:  [
      "Ich bin rund wie ein Vollmond. Danke Lea. 🌕",
      "Meine Beine haben vergessen wie Laufen geht.",
      "Couch-Potato-Level: Meister. Schade eigentlich.",
      "Der Arzt sagt, ich soll mich bewegen. Du auch, nebenbei.",
      "Ich und Sport... wir sollten uns mal wieder treffen.",
      "Mein Fitnesslevel ist: Sofa. Stage 3. 🛋️😮‍💨"
    ],
    crit: [
      "HILFE ICH BIN EIN BLOB!! 🫠 Wir müssen reden.",
      "Ich rolle statt zu gehen. Das ist ein Hilferuf.",
      "Mein letztes Workout war... ich erinnere mich nicht. Zu lange her.",
      "Bewegungsmangel – die stille Katastrophe. Ich bin die Katastrophe.",
      "Mir ist warm und ich habe mich nicht bewegt. Das ist ein Zeichen. 🚩"
    ]
  },
  happy: [
    "Du bist die Beste, Lea! 🌈✨",
    "Ich bin so glücklich – kein Dramatik heute! 🎉",
    "Leben ist schön wenn man gut versorgt ist! 💖",
    "Danke für das Essen! Ich liebe dich! 🥰",
    "Perfekte Pflege! 10/10 Würde mich wieder pflegen lassen.",
    "Bruno.exe läuft einwandfrei! 🟢",
    "Ich spring vor Freude! Wörtlich! Siehst du das?! 🐾"
  ],
  neutral: [
    "Hmm. Könnte besser sein. Könnte schlechter sein.",
    "Mir geht's... mittelmäßig. Also eigentlich typisch.",
    "Ich beobachte die Situation. Aufmerksam.",
    "Weder glücklich noch traurig. Sehr deutsch von mir.",
    "Durchschnitt ist auch ein Zustand. 🤷"
  ],
  phoenixWarn: [
    "Ich spüre etwas... Seltsames. Eine Hitze von innen. 🔥",
    "Mein Körper macht gerade Dinge. Große Dinge. 🌡️",
    "Ist es hier heiß oder bin ich das...? 🔥",
    "Ich höre epische Musik. Hörst du sie auch? 🎵🔥"
  ]
};

// ── State ──
const DEFAULTS = { water: 100, food: 100, exercise: 100, age: 0, generation: 1, isEgg: false };

let state = loadState();
let isEgg = !!state.isEgg;
let phoenixPending = false;
let hatchTimer = null;
let exerciseAnimTimeout = null;
let messageRotateInterval = null;

function loadState() {
  try {
    const raw = localStorage.getItem('bruno_state');
    if (raw) {
      const s = JSON.parse(raw);
      delete s.dead; // migrate old saves
      return { ...DEFAULTS, ...s };
    }
  } catch(e) {}
  return { ...DEFAULTS, lastTick: Date.now() };
}
function saveState() {
  state.lastTick = Date.now();
  localStorage.setItem('bruno_state', JSON.stringify(state));
}

function applyOfflineDecay() {
  const now = Date.now();
  const elapsed = (now - (state.lastTick || now)) / 60000; // minutes
  if (elapsed > 0 && !state.isEgg) {
    state.water    = Math.max(1, (state.water    ?? 100) - DECAY_RATE.water    * elapsed);
    state.food     = Math.max(1, (state.food     ?? 100) - DECAY_RATE.food     * elapsed);
    state.exercise = Math.max(1, (state.exercise ?? 100) - DECAY_RATE.exercise * elapsed);
    state.age      = (state.age || 0) + elapsed;
  }
  state.lastTick = now;
}

// ── Helpers ──
const $ = id => document.getElementById(id);
const brunoEl = $('bruno');

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function updateBars() {
  ['water','food','exercise'].forEach(stat => {
    const val = Math.round(state[stat]);
    $(`${stat}Bar`).style.width = val + '%';
    $(`${stat}Val`).textContent = val;
    const bar = $(`${stat}Bar`);
    bar.classList.remove('low','crit');
    if (val <= 15) bar.classList.add('crit');
    else if (val <= 35) bar.classList.add('low');
  });
}

function getMood() {
  if (isEgg || phoenixPending) return phoenixPending ? 'phoenix' : 'egg';
  const min = Math.min(state.water, state.food, state.exercise);
  const avg = (state.water + state.food + state.exercise) / 3;
  if (min <= 15 || avg < 25) return 'sad';
  if (min > 60 && avg > 70)  return 'happy';
  return 'neutral';
}

function updatePetState() {
  const mood = getMood();

  if (mood === 'egg') {
    brunoEl.style.display = 'none';
    $('eggWrap').classList.add('show');
    for (let i = 1; i <= 5; i++) $(`md${i}`).classList.remove('active');
    $('moodLabel').textContent = '🥚 EI';
    $('moodLabel').style.color = 'var(--phoenix)';
    $('genInfo').textContent = `Generation ${state.generation} · ${formatAge(state.age)}`;
    return;
  }

  $('eggWrap').classList.remove('show');
  brunoEl.style.display = '';
  brunoEl.classList.remove('happy','neutral','sad','exercise','phoenix');
  brunoEl.classList.add(mood);

  const avg = (state.water + state.food + state.exercise) / 3;
  const dots = Math.max(1, Math.round(avg / 20));
  for (let i = 1; i <= 5; i++) $(`md${i}`).classList.toggle('active', i <= dots);

  if (mood === 'phoenix') {
    $('moodLabel').textContent = '🔥 PHÖNIX';
    $('moodLabel').style.color = 'var(--phoenix)';
  } else {
    const labels = ['','SAD','MEH','OKAY','GOOD','HAPPY'];
    $('moodLabel').textContent = labels[Math.min(5, dots)];
    $('moodLabel').style.color = dots >= 4 ? 'var(--green)' : dots <= 2 ? 'var(--red)' : 'var(--accent3)';
  }
  $('genInfo').textContent = `Generation ${state.generation} · ${formatAge(state.age)}`;
}

function formatAge(m) {
  m = Math.floor(m || 0);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}min` : `${h}h`;
}

function pickMessage() {
  if (isEgg) return null;
  if (phoenixPending) return rand(MESSAGES.phoenixWarn);
  const sorted = ['water','food','exercise']
    .map(s => ({ s, v: state[s] }))
    .sort((a,b) => a.v - b.v);
  const worst = sorted[0];
  if (worst.v <= 15) return rand(MESSAGES[worst.s].crit);
  if (worst.v <= 35) return rand(MESSAGES[worst.s].low);
  return getMood() === 'happy' ? rand(MESSAGES.happy) : rand(MESSAGES.neutral);
}

function showSpeech(msg) {
  const el = $('speechBubble');
  el.style.opacity = '0';
  setTimeout(() => { el.textContent = msg; el.style.opacity = '1'; }, 200);
}

function rotateMessages() {
  const msg = pickMessage();
  if (msg) showSpeech(msg);
}

function updateStatusMsg() {
  const el = $('statusMsg');
  if (isEgg) {
    el.textContent = '🥚 Bruno verwandelt sich... Warte auf das Schlüpfen!';
    el.style.color = 'var(--phoenix)';
    return;
  }
  if (phoenixPending) {
    el.textContent = '🔥 Etwas Magisches passiert... Bruno leuchtet!';
    el.style.color = 'var(--phoenix)';
    return;
  }
  const min = Math.min(state.water, state.food, state.exercise);
  if (min <= 15) {
    el.textContent = '🚨 NOTFALL! Bruno braucht sofort Hilfe!';
    el.style.color = 'var(--red)';
  } else if (min <= 35) {
    const icons = { water:'💧', food:'🥗', exercise:'🏃' };
    const which = ['water','food','exercise'].filter(s => state[s] <= 35).map(n => icons[n]).join(' ');
    el.textContent = `⚠️ ${which} braucht Aufmerksamkeit!`;
    el.style.color = 'var(--accent3)';
  } else {
    const avg = (state.water + state.food + state.exercise) / 3;
    if (avg > 75) { el.textContent = 'Bruno ist topfit! Danke, Lea! 💜'; el.style.color = 'var(--green)'; }
    else          { el.textContent = 'Alles im grünen Bereich! 👍';       el.style.color = '#b090f0'; }
  }
}

// ── Tick ──
function tick() {
  if (isEgg || phoenixPending) return;

  const frac = TICK_INTERVAL / 60000;
  state.water    = Math.max(1, state.water    - DECAY_RATE.water    * frac);
  state.food     = Math.max(1, state.food     - DECAY_RATE.food     * frac);
  state.exercise = Math.max(1, state.exercise - DECAY_RATE.exercise * frac);
  state.age      = (state.age || 0) + frac;

  if (state.water <= 1 && state.food <= 1 && state.age >= PHOENIX_AGE_MINUTES) {
    beginPhoenixSequence();
    return;
  }

  updateBars();
  updatePetState();
  updateStatusMsg();
  saveState();
}

// ── Phoenix Sequence ──
function beginPhoenixSequence() {
  phoenixPending = true;
  clearInterval(messageRotateInterval);
  updatePetState();
  updateStatusMsg();
  showSpeech(rand(MESSAGES.phoenixWarn));
  saveState();

  // Phase 1 (2s): glow + warn message
  setTimeout(() => {
    showSpeech('🔥 Ich... verwandle mich...!! 🔥');
    spawnFireParticles();
  }, 2000);

  // Phase 2 (4s): flash + vanish → egg appears
  setTimeout(() => {
    triggerFlash();
    brunoEl.style.animation = 'phoenixVanish 0.7s ease-out forwards';
    setTimeout(() => {
      brunoEl.style.display = 'none';
      brunoEl.style.animation = '';
      phoenixPending = false;
      isEgg = true;
      state.isEgg = true;
      saveState();
      updatePetState();
      updateStatusMsg();
      showSpeech('🥚 Ein Ei! Warte auf das Schlüpfen, Lea! 🔥');
      spawnFireParticles();
      showToast('🔥 Bruno verwandelt sich! Phönix-Modus!');
      scheduleHatch();
    }, 700);
  }, 4000);
}

function scheduleHatch() {
  clearTimeout(hatchTimer);
  // start wobbling + add cracks 2s before hatch
  hatchTimer = setTimeout(() => {
    const egg = $('egg');
    ['c1','c2','c3'].forEach(c => {
      const el = document.createElement('div');
      el.className = `egg-crack ${c}`;
      egg.appendChild(el);
    });
    egg.classList.add('wobbling');
    showSpeech('🥚 Es bewegt sich!! Fast da!! 🐣');
    setTimeout(hatchEgg, 2000);
  }, HATCH_DELAY_MS - 2000);
}

function hatchEgg() {
  const egg = $('egg');
  egg.classList.remove('wobbling');
  egg.classList.add('hatching');
  triggerFlash();
  spawnFireParticles();

  setTimeout(() => {
    $('eggWrap').classList.remove('show');
    egg.classList.remove('hatching');
    egg.innerHTML = '';
    isEgg = false;
    state.isEgg = false;
    state.generation = (state.generation || 1) + 1;
    state.water    = 90;
    state.food     = 90;
    state.exercise = 80;
    state.age      = 0;
    saveState();

    brunoEl.style.display = '';
    brunoEl.style.animation = 'newBrunoAppear 0.9s ease-out forwards';
    setTimeout(() => { brunoEl.style.animation = ''; updatePetState(); }, 900);

    updateBars();
    updatePetState();
    updateStatusMsg();
    spawnFireParticles();

    const g = state.generation;
    showSpeech(`✨ ICH BIN WIEDER DA!! Generation ${g} – stärker als je zuvor! 🐣🔥`);
    showToast(`🐣 Bruno Gen.${g} ist geschlüpft!`);
    startMessageRotation();
  }, 700);
}

// ── Feed Actions ──
function feedAction(type) {
  if (isEgg || phoenixPending) {
    showToast('🥚 Bruno schläft im Ei. Warte auf das Schlüpfen!');
    return;
  }
  state[type] = Math.min(100, state[type] + REFILL_AMOUNT);
  saveState();
  updateBars();

  const btnId = 'btn' + type[0].toUpperCase() + type.slice(1);
  const btn = $(btnId);
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 200);

  const r = {
    water:    { msg: 'Ahhh! Erfrischend! Danke Lea! 💧😊', emoji: '💧', toast: 'Wasser gegeben! 💧' },
    food:     { msg: 'Nom nom nom! SO GUT! 🥗😋',           emoji: '🥗', toast: 'Gefüttert! 🥗' },
    exercise: { msg: 'JA! Sport! Ich liebe Sport! 🏃💪',    emoji: '🏃', toast: 'Sport gemacht! 🏃' }
  }[type];
  showSpeech(r.msg);
  showToast(r.toast);
  spawnFloatEmoji(r.emoji, btn);

  if (type === 'exercise') {
    brunoEl.classList.remove('happy','neutral','sad');
    brunoEl.classList.add('exercise');
    clearTimeout(exerciseAnimTimeout);
    exerciseAnimTimeout = setTimeout(() => { brunoEl.classList.remove('exercise'); updatePetState(); }, 2000);
  } else {
    brunoEl.classList.remove('happy','neutral','sad','exercise');
    brunoEl.classList.add('happy');
    clearTimeout(exerciseAnimTimeout);
    exerciseAnimTimeout = setTimeout(() => { brunoEl.classList.remove('happy'); updatePetState(); }, 1500);
    spawnSparkles(5);
  }
  updatePetState();
  updateStatusMsg();
}

// ── Effects ──
function spawnSparkles(count) {
  const s = $('sparkles');
  const emojis = ['✨','⭐','💫','🌟','💥'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = rand(emojis);
      el.style.left = (10 + Math.random() * 80) + '%';
      el.style.top  = (10 + Math.random() * 60) + '%';
      s.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }, i * 80);
  }
}

function spawnFireParticles() {
  const s = $('sparkles');
  const emojis = ['🔥','✨','💫','⭐','🌟','🧡','💛'];
  for (let i = 0; i < 14; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = rand(emojis);
      el.style.left = (5 + Math.random() * 90) + '%';
      el.style.top  = (5 + Math.random() * 75) + '%';
      el.style.fontSize = (11 + Math.random() * 10) + 'px';
      s.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }, i * 90);
  }
}

function triggerFlash() {
  const f = $('stageFlash');
  f.classList.remove('active');
  void f.offsetWidth;
  f.classList.add('active');
  setTimeout(() => f.classList.remove('active'), 450);
}

function spawnFloatEmoji(emoji, btn) {
  const el = document.createElement('div');
  el.className = 'float-pop';
  el.textContent = emoji;
  const r = btn.getBoundingClientRect();
  el.style.left = r.left + r.width / 2 - 15 + 'px';
  el.style.top  = r.top - 10 + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2500);
}

function startMessageRotation() {
  clearInterval(messageRotateInterval);
  rotateMessages();
  messageRotateInterval = setInterval(rotateMessages, 6000);
}

// ── Init ──
function init() {
  const offlineMs = Date.now() - (state.lastTick || Date.now());
  applyOfflineDecay();

  if (isEgg) {
    brunoEl.style.display = 'none';
    $('eggWrap').classList.add('show');
    scheduleHatch();
  }

  updateBars();
  updatePetState();
  updateStatusMsg();
  if (!isEgg) startMessageRotation();

  setInterval(tick, TICK_INTERVAL);

  const offlineMin = Math.round(offlineMs / 60000);
  if (offlineMin > 5 && !isEgg) {
    setTimeout(() => showToast(`Bruno war ${offlineMin} Minuten allein... 😢`), 1500);
  }
  saveState();
}

init();
</script>
</body>
</html>
